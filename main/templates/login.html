{% extends 'basestructure.html' %}
{% block title %} Login {% endblock %}
{% block content %}
<div class="form-container">
  <div class="login-box">
    <h3 class="brand-heading">Precy Plastic Wares</h3>
    
    <!-- ✅ Success Message -->
    {% if success %}
      <div style="background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        ✓ {{ success }}
      </div>
    {% endif %}

    <!-- ✅ Error Message -->
    {% if error %}
      <div style="background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
        ✗ {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
      {% csrf_token %}
      <div class="user-box">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required />
      </div>
      <div class="user-box">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>

    <p style="text-align: center; margin-top: 20px; color: #3c2a4d;">
      Don't have an account? <a href="{% url 'signup' %}" style="color: #6a1b9a; text-decoration: none; font-weight: 600;">Sign up here</a>
    </p>
  </div>
</div>
{% endblock %}
